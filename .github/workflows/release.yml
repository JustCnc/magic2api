name: Release plugin assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish plugin binaries
    # Ubuntu 22.04 keeps the glibc baseline older than ubuntu-latest (24.04),
    # so the produced .so loads on more CPA hosts.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          fetch-depth: 0

      - name: Resolve release tag and version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          VERSION="${RELEASE_TAG#v}"
          DECLARED="$(grep -oE 'pluginVersion[[:space:]]*=[[:space:]]*"[^"]+"' schema.go | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$VERSION" != "$DECLARED" ]; then
            echo "tag $RELEASE_TAG does not match pluginVersion $DECLARED in schema.go" >&2
            exit 1
          fi
          echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install cross compilers and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            gcc-mingw-w64-x86-64 \
            zip unzip

      - name: Run tests
        run: |
          gofmt -l . | tee /tmp/fmt.txt
          test ! -s /tmp/fmt.txt
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go test ./...

      - name: Build shared libraries
        run: |
          set -euo pipefail
          mkdir -p out
          build() {
            local goos="$1" goarch="$2" cc="$3" ext="$4"
            echo "==> $goos/$goarch"
            CGO_ENABLED=1 GOOS="$goos" GOARCH="$goarch" CC="$cc" \
              go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o "out/magic2api.$ext" .
            rm -f out/magic2api.h
            (cd out && zip -q "magic2api_${VERSION}_${goos}_${goarch}.zip" "magic2api.$ext")
            rm -f "out/magic2api.$ext"
          }
          build linux amd64 gcc so
          build linux arm64 aarch64-linux-gnu-gcc so
          build windows amd64 x86_64-w64-mingw32-gcc dll
          ls -l out

      - name: Write checksums
        run: |
          cd out
          sha256sum *.zip > checksums.txt
          cat checksums.txt

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" out/*.zip out/checksums.txt --clobber
